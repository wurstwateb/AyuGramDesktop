[project]
name = "typsync"
version = "0.1.0"
description = "TypendruckerGram Sync: relay and catcher"
requires-python = ">=3.12"
dependencies = ["cryptography>=43", "aiohttp>=3.10"]

[project.optional-dependencies]
catcher = ["telethon>=1.36"]
test = ["pytest>=8", "pytest-aiohttp>=1.0", "telethon>=1.36"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["typsync*"]
